{% comment %}문제 제보 BO 전용 CSS. 기존 BO 토큰/컴포넌트 위에 얹는다.{% endcomment %}
<style>
  .report-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--space-3);
    margin-bottom: var(--space-5);
  }

  .report-summary-card {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-4);
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .report-summary-label {
    font-size: var(--font-size-xs);
    color: var(--color-text-muted);
  }

  .report-summary-value {
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    letter-spacing: -.02em;
  }

  .report-filter-card {
    margin-bottom: var(--space-5);
  }

  .report-search {
    display: grid;
    grid-template-columns: minmax(150px, 220px) 1fr auto auto;
    gap: var(--space-2);
    align-items: center;
  }

  .report-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .report-table-card {
    padding: 0;
    overflow: hidden;
  }

  .report-table-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-5);
    border-bottom: 1px solid var(--color-border);
  }

  .report-table-subtitle {
    margin: var(--space-1) 0 0;
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
  }

  .report-table-wrap {
    overflow-x: auto;
  }

  .report-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 980px;
  }

  .report-table th,
  .report-table td {
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--color-border);
    text-align: center;
    vertical-align: middle;
  }

  .report-table td:nth-child(3) {
    text-align: left;
  }

  .report-table th {
    background: var(--color-bg-secondary);
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    white-space: nowrap;
  }

  .report-table tbody tr:hover {
    background: var(--color-bg-secondary);
  }

  .report-table-id {
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
  }

  .report-table-muted,
  .report-last-question {
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
  }

  .report-title-link {
    color: var(--color-text-primary);
    font-weight: var(--font-weight-semibold);
  }

  .report-title-link:hover {
    color: var(--color-accent-text);
  }

  .report-last-question {
    margin-top: 2px;
    line-height: var(--line-height-normal);
  }

  .report-card-link {
    display: block;
  }

  .report-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--space-4);
    margin: 0;
    transition: border-color var(--transition-base), box-shadow var(--transition-base),
      transform var(--transition-base);
  }

  .report-card:hover {
    border-color: var(--color-accent-border);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .report-card-title {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-bottom: var(--space-2);
  }

  .report-card-title h2 {
    margin: 0;
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-semibold);
  }

  .report-preview {
    margin: 0 0 var(--space-3);
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    line-height: var(--line-height-normal);
  }

  .report-meta {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
  }

  .report-card-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-3);
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
    white-space: nowrap;
  }

  .report-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px var(--space-2);
    border-radius: var(--radius-full);
    background: var(--color-bg-tertiary);
    color: var(--color-text-secondary);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
  }

  .report-detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
    gap: var(--space-5);
    align-items: start;
  }

  .report-stack {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .report-meta-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
    margin: 0;
  }

  .report-meta-item {
    padding: var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-bg-secondary);
  }

  .report-meta-item dt {
    margin-bottom: 2px;
    font-size: var(--font-size-xs);
    color: var(--color-text-muted);
  }

  .report-meta-item dd {
    margin: 0;
    font-size: var(--font-size-sm);
    color: var(--color-text-primary);
    word-break: break-word;
  }

  .report-pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    line-height: var(--line-height-normal);
  }

  .report-md {
    color: var(--color-text-primary);
    line-height: var(--line-height-normal);
    word-break: break-word;
  }

  .report-md p {
    margin: 0 0 var(--space-3);
  }

  .report-md p:last-child,
  .report-md ul:last-child,
  .report-md ol:last-child,
  .report-md-table-wrap:last-child {
    margin-bottom: 0;
  }

  .report-md ul,
  .report-md ol {
    margin: 0 0 var(--space-3);
    padding-left: var(--space-5);
  }

  .report-md li + li {
    margin-top: 4px;
  }

  .report-md code {
    padding: 1px 5px;
    border-radius: var(--radius-sm);
    background: var(--color-bg-tertiary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: .92em;
  }

  .report-md-table-wrap {
    margin: var(--space-3) 0;
    overflow-x: auto;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
  }

  .report-md-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 420px;
    background: var(--color-bg);
  }

  .report-md-table th,
  .report-md-table td {
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--color-border);
    border-right: 1px solid var(--color-border);
    text-align: left;
    vertical-align: top;
  }

  .report-md-table th:last-child,
  .report-md-table td:last-child {
    border-right: 0;
  }

  .report-md-table tr:last-child td {
    border-bottom: 0;
  }

  .report-md-table th {
    background: var(--color-bg-secondary);
    font-weight: var(--font-weight-semibold);
  }

  .report-timeline {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .report-turn {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    background: var(--color-bg);
    overflow: hidden;
  }

  .report-turn-user {
    border-color: var(--color-accent-border);
  }

  .report-turn-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    background: var(--color-bg-secondary);
    font-size: var(--font-size-xs);
    color: var(--color-text-muted);
  }

  .report-turn-body {
    padding: var(--space-4);
  }

  .report-sources {
    margin-top: var(--space-3);
    padding-top: var(--space-3);
    border-top: 1px solid var(--color-border);
  }

  .report-source-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin: var(--space-2) 0 0;
    padding: 0;
    list-style: none;
  }

  .report-source-list li {
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    background: var(--color-bg-secondary);
    font-size: var(--font-size-xs);
    word-break: break-all;
  }

  .report-side-panel {
    position: sticky;
    top: var(--space-6);
  }

  .report-action-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .report-action-form > .btn,
  .report-delete-form > .btn {
    width: 100%;
  }

  .report-delete-form {
    margin-top: var(--space-4);
    padding-top: var(--space-4);
    border-top: 1px solid var(--color-border);
    text-align: center;
  }

  .report-danger-note {
    margin: var(--space-2) 0 0;
    color: var(--color-danger);
    font-size: var(--font-size-xs);
    line-height: var(--line-height-normal);
    text-align: center;
  }

  .report-card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }

  .report-card-title-row .card-title {
    margin-bottom: 0;
  }

  @media (max-width: 960px) {
    .report-search {
      grid-template-columns: 1fr;
    }
    .report-table-head {
      flex-direction: column;
    }
    .report-card,
    .report-detail-grid {
      grid-template-columns: 1fr;
    }
    .report-card-side {
      align-items: flex-start;
    }
    .report-side-panel {
      position: static;
    }
    .report-meta-list {
      grid-template-columns: 1fr;
    }
  }
</style>
